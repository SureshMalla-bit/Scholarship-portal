# Render gives the port in the PORT variable; on your laptop it is 8080
server.port=${PORT:8080}

# Database. Defaults are for MySQL on your laptop.
# For deployment set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scholarship_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Create and update tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Which websites may call this API (your React app). * = any.
app.cors.allowed-origins=${FRONTEND_URL:*}

# Admin account created on first start. Change the password before deploying.
app.admin.email=${ADMIN_EMAIL:admin@scholarship.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
